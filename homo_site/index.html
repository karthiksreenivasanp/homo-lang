<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homo App</title>
  
  <style>
    :root {
    --bg: #1a1a2e;
    --fg: #e0e0e0;
    --accent: #7b2fff;
    --card-bg: #16213e;
    --border: #333355;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    .homo-nav { background: var(--accent); padding: 0.75rem 1.5rem; display: flex; flex-wrap: wrap; gap: 1rem; }
    .homo-nav a { color: #fff; text-decoration: none; font-weight: 600; }
    .homo-nav a:hover { text-decoration: underline; }
    .homo-header { padding: 2rem 1.5rem 1rem; border-bottom: 2px solid var(--border); }
    .homo-header h1 { font-size: 2rem; }
    .homo-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .homo-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .homo-card h3 { margin-bottom: 0.5rem; color: var(--accent); }
    .homo-footer { text-align: center; padding: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; opacity: 0.7; margin-top: 2rem; }
    .homo-form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 480px; }
    .homo-form input, .homo-form textarea, .homo-form select { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 1rem; }
    .homo-form button, button.homo-btn { padding: 0.55rem 1.25rem; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; }
    .homo-form button:hover, button.homo-btn:hover { opacity: 0.85; }
    img.homo-img { max-width: 100%; height: auto; border-radius: 6px; }
    ul.homo-list { padding-left: 1.5rem; }
    @media (max-width: 600px) { .homo-content { padding: 0 1rem; } .homo-header h1 { font-size: 1.4rem; } .homo-nav { gap: 0.5rem; } }
  </style>
</head>
<body>
  <header class="homo-header"><h1>My Portfolio</h1></header>
  <main class="homo-content">
    <div class="homo-card">
      <h3>About</h3>
      <p>AI Developer</p>
    </div>
  </main>
  <footer class="homo-footer">Made with Homo</footer>
  
</body>
</html>
